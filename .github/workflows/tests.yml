name: SHOR software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts
      - run: python -m ruff check --select E9,F821,F822,F823 app scripts tests
      - run: node --check app/static/app.js
      - run: python scripts/check_repository.py
